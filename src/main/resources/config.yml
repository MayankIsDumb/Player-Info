# ============================================================
#  PlayerInfo configuration
# ============================================================

# Track PvP fights (hits, crits, combos, damage), persist them to
# fights.json, and show interactive PvP death messages with a
# clickable fight summary. When false, existing history stays
# viewable but no new fights are recorded.
pvp-fight-tracking: true

# How long (seconds) after the last hit a fight stays active.
fight-idle-timeout-seconds: 30

# How many fight summaries are kept in fights.json.
keep-fight-summaries: 50

# Send a small welcome hint when a player joins.
join-welcome-message: true

# How often the leaderboards re-scan player statistics (minutes).
leaderboard-refresh-minutes: 5

# Minutes of inactivity before a player counts as AFK (website badge).
afk-minutes: 5

# Announce (in chat + Discord) when a player reaches these playtime hours.
milestones-hours: [10, 50, 100]

# Playtime ranks: the highest threshold a player has crossed applies.
# "commands" are run from the console with {player}, {rank} and {hours}.
playtime-ranks:
  enabled: true
  thresholds:
    - hours: 10
      name: "Regular"
    - hours: 50
      name: "Veteran"
      commands:
        - "say {player} is now a {rank}!"
    - hours: 100
      name: "Legend"
      commands:
        - "say {player} is now a {rank}!"

# Post fights, challenge advancements, milestones and deaths to a Discord
# channel webhook (Server Settings → Integrations → Webhooks).
discord:
  enabled: false
  webhook-url: ""
  post-fights: true
  post-challenges: true
  post-milestones: true
  post-deaths: false

# Built-in website: a dashboard served by the plugin at
# http://<server-ip>:<port> showing stats, fights and leaderboards.
web:
  enabled: true
  port: 8080
  bind: 0.0.0.0
  site-name: "Server Stats"
  # Shown on the home page, e.g. "play.example.com". Leave empty to
  # display the web address instead.
  server-address: ""
  # How often the live data (players online etc.) refreshes (seconds).
  cache-seconds: 10
  # API requests allowed per IP per minute (0 = unlimited).
  rate-limit-per-minute: 120
  # Show the PvP fights feed on the website.
  public-fights: true
