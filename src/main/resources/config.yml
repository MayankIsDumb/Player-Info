# ============================================================
#  PlayerInfo configuration
# ============================================================

# Track PvP fights (hits, crits, combos, damage), persist them to
# fights.json, and show interactive PvP death messages with a
# clickable fight summary. When false, existing history stays
# viewable but no new fights are recorded.
pvp-fight-tracking: true

# How long (seconds) after the last hit a fight stays active.
fight-idle-timeout-seconds: 30

# How many fight summaries are kept in fights.json.
keep-fight-summaries: 50

# Send a small welcome hint when a player joins.
join-welcome-message: true

# How often the leaderboards re-scan player statistics (minutes).
leaderboard-refresh-minutes: 5

# Built-in website: a dashboard served by the plugin at
# http://<server-ip>:<port> showing stats, fights and leaderboards.
web:
  enabled: true
  port: 8080
  bind: 0.0.0.0
  site-name: "Server Stats"
  # Shown on the home page, e.g. "play.example.com". Leave empty to
  # display the web address instead.
  server-address: ""
  # How often the live data (players online etc.) refreshes (seconds).
  cache-seconds: 10
